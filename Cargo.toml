[package]
name = "traceview"
authors = ["javaLux"]
version = "2.2.1"
edition = "2024"
description = "Tracing and viewing your files and resource landscape"
license = "MIT"
repository = "https://github.com/javaLux/traceview"
readme = "README.md"
keywords = ["file-explorer", "tui", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.85.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "cargo", "string"] }
crossterm = { version = "0.29.0", default-features = false, features = ["event-stream", "serde"] }
ratatui = "0.30.2"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "time", "rt-multi-thread", "fs"] }
tokio-util = "0.7.20"
futures = "0.3.34"
path-absolutize = "4.0.1"
serde = { version = "1.0.229", default-features = false, features = ["serde_derive"] }
serde_json = "1.0.154"
log = "0.4.35"
os_info = { version = "3.15.0", default-features = false }
simplelog = "0.12.2"
chrono = "0.4.45"
sysinfo = "0.40.4"
walkdir = "2.5.1"
async-trait = "0.1.92"
file-format = {version = "0.29.0", features = ["reader"]}
dirs = "7.0.0"
confy = "2.0.0"
console = "0.16.6"
copypasta = "0.10.2"
human_bytes = {version = "0.4.3", default-features = false}
tui-checkbox = "0.6.1"


[profile.release]
# compiler optimizations for binary size
opt-level = "s"
# link optimizations -> causes a longer link time but produce better optimize code
lto = true
# strip either symbols or debug info from the final binary
strip = true
